name: Publish H9 Qibla 7.3 OTA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-73.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download H9 Qibla 7.3 artifact
        run: |
          curl -L --fail --retry 3 -o /tmp/h9q73.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-a674-8211-80c3-6cb85cfa1f91/raw?se=2026-10-11T11%3A36%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=5cfed35b-81f6-5596-9ce7-d332b25194e9&skoid=a3d7d4f3-706d-48bc-8860-17488c12cb39&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A35%3A33Z&ske=2026-10-11T23%3A35%3A33Z&sks=b&skv=2026-02-06&sig=xqm1jCT5L/NcZY6qrkrKzqFadvSmFV7Ria22gH%2BhSDA%3D'
          rm -rf /tmp/h9q73
          mkdir -p /tmp/h9q73
          unzip -o /tmp/h9q73.zip -d /tmp/h9q73
          cp /tmp/h9q73/H9-Qibla-7.0-Production-Key-Haval-H9.apk ./H9-Qibla-7.3-Region-Update-Dialog-Fix-Haval-H9.apk
          echo '0d74fb07d5e0f1f1754e793d0d02d891ade30b007185a8d122eb2b799caa7459  H9-Qibla-7.3-Region-Update-Dialog-Fix-Haval-H9.apk' > H9-Qibla-7.3-Region-Update-Dialog-Fix-Haval-H9.sha256
          sha256sum -c H9-Qibla-7.3-Region-Update-Dialog-Fix-Haval-H9.sha256
          cat > latest.json <<'EOF'
          {
            "versionCode": 73,
            "versionName": "7.3-region-update-dialog-fix",
            "apkUrl": "https://raw.githubusercontent.com/bandar-sul/HQibla-OTA/main/H9-Qibla-7.3-Region-Update-Dialog-Fix-Haval-H9.apk",
            "sha256": "0d74fb07d5e0f1f1754e793d0d02d891ade30b007185a8d122eb2b799caa7459",
            "notes": "إصلاح عرض المنطقة مع بديل لمناطق السعودية، واستبدال نافذة التحديث بنافذة داكنة مخصصة بالكامل."
          }
          EOF
      - name: Commit OTA 7.3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add H9-Qibla-7.3-Region-Update-Dialog-Fix-Haval-H9.apk H9-Qibla-7.3-Region-Update-Dialog-Fix-Haval-H9.sha256 latest.json
          git commit -m "Publish H9 Qibla 7.3 OTA" || exit 0
          git push
