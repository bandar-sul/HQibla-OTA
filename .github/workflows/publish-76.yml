name: Publish H9 Qibla 7.6 OTA
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-76.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download H9 Qibla 7.6 artifact
        run: |
          curl -L --fail --retry 3 -o /tmp/h9q76.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-e3a0-8211-9e7d-c3abd6cb3ce7/raw?se=2026-10-11T21%3A50%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=0ff5442d-48b8-5feb-a455-c4e3e5066cdc&skoid=a3d7d4f3-706d-48bc-8860-17488c12cb39&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A33%3A30Z&ske=2026-10-11T23%3A33%3A30Z&sks=b&skv=2026-02-06&sig=75%2B4u9oj5MduATP5XD81HD2/%2BjQOiyIx0EiR4VrkPgM%3D'
          rm -rf /tmp/h9q76
          mkdir -p /tmp/h9q76
          unzip -o /tmp/h9q76.zip -d /tmp/h9q76
          cp /tmp/h9q76/H9-Qibla-7.0-Production-Key-Haval-H9.apk ./H9-Qibla-7.6-Region-Theme-Prayer-UI-Haval-H9.apk
          echo 'c66f29b0d129932ea2e981f7b6b137e1c00727378b71e475ede07ada151cb7e0  H9-Qibla-7.6-Region-Theme-Prayer-UI-Haval-H9.apk' > H9-Qibla-7.6-Region-Theme-Prayer-UI-Haval-H9.sha256
          sha256sum -c H9-Qibla-7.6-Region-Theme-Prayer-UI-Haval-H9.sha256
          cat > latest.json <<'EOF'
          {
            "versionCode": 76,
            "versionName": "7.6-region-theme-prayer-ui",
            "apkUrl": "https://raw.githubusercontent.com/bandar-sul/HQibla-OTA/main/H9-Qibla-7.6-Region-Theme-Prayer-UI-Haval-H9.apk",
            "sha256": "c66f29b0d129932ea2e981f7b6b137e1c00727378b71e475ede07ada151cb7e0",
            "notes": "● إضافة الوضع النهاري والليلي والتلقائي\n● إصلاح ظهور اسم المنطقة حتى عند فشل Geocoder\n● تحسين دقة الفجر والشروق ومعايرتهما لأم القرى\n● تصغير القائمة الجانبية\n● تصغير حجم البوصلة\n● تكبير مواقيت الصلاة وتحسين وضوحها\n● تحسينات عامة في الواجهة والموقع"
          }
          EOF
      - name: Commit OTA 7.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add H9-Qibla-7.6-Region-Theme-Prayer-UI-Haval-H9.apk H9-Qibla-7.6-Region-Theme-Prayer-UI-Haval-H9.sha256 latest.json
          git commit -m "Publish H9 Qibla 7.6 OTA" || exit 0
          git push
