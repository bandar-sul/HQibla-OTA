name: Publish H9 Qibla 7.5 Manual Download
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-75-manual.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download H9 Qibla 7.5 manual artifact
        run: |
          curl -L --fail --retry 3 -o /tmp/h9q75.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-974c-8211-a7e7-d322870949a4/raw?se=2026-10-11T17%3A07%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=2f925763-e2b1-5af5-b2de-ed96eb8d7b17&skoid=a3d7d4f3-706d-48bc-8860-17488c12cb39&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T02%3A42%3A42Z&ske=2026-10-12T02%3A42%3A42Z&sks=b&skv=2026-02-06&sig=K6%2BZRYH8mVSnp%2Bv7R73Ywj9pMkdAFyOKIjs3fQAkCY4%3D'
          rm -rf /tmp/h9q75
          mkdir -p /tmp/h9q75
          unzip -o /tmp/h9q75.zip -d /tmp/h9q75
          cp /tmp/h9q75/H9-Qibla-7.0-Production-Key-Haval-H9.apk ./H9-Qibla-7.5-Manual-Haval-H9.apk
          sha256sum H9-Qibla-7.5-Manual-Haval-H9.apk
      - name: Commit manual APK only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add H9-Qibla-7.5-Manual-Haval-H9.apk
          git commit -m "Add H9 Qibla 7.5 manual download" || exit 0
          git push
